<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B2D26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <text x="600" y="380" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">Kente Prestige</text>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7" letter-spacing="3">WEDDING THEME</text>
  <rect x="500" y="470" width="200" height="2" fill="white" opacity="0.4"/>
</svg>
