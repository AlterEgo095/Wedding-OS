# ══════════════════════════════════════════════════════════════════════════
# Nginx Configuration — Josué & Hornella Wedding Platform
# Ultra-secure production reverse proxy with SSL, rate limiting,
# security headers, compression, and caching
# ══════════════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Hide Nginx Version ───
    server_tokens off;

    # ─── Custom Log Format (with request time & upstream response time) ───
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─── Performance Tuning ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # ─── Upstream Definition ───
    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    # ─── Rate Limiting Zones ───
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=guest_auth:10m rate=10r/m;
    limit_req_status 429;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        font/opentype
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ─── Brotli Compression (if module available) ───
    # Install: apt-get install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    # Load modules in main context:
    #   load_module modules/ngx_http_brotli_filter_module.so;
    #   load_module modules/ngx_http_brotli_static_module.so;
    #brotli on;
    #brotli_comp_level 6;
    #brotli_static on;
    #brotli_types
    #    text/plain
    #    text/css
    #    text/xml
    #    text/javascript
    #    application/json
    #    application/javascript
    #    application/xml+rss
    #    application/rss+xml
    #    application/atom+xml
    #    image/svg+xml;

    # ─── X-Request-ID Header ───
    # Pass through if client provides one, otherwise generate a unique ID
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ─── Shared SSL Session Cache ───
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ─── OCSP Stapling (staple validator) ───
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ═══════════════════════════════════════════════════════════════
    # HTTP → HTTPS Redirect Server
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt ACME challenge support
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Reject all other HTTP traffic → force HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════
    # Main HTTPS Server
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ─── SSL Configuration ───
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # TLS protocols — TLSv1.2 minimum, TLSv1.3 preferred
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suites only (TLSv1.3 ciphers are negotiated automatically)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Diffie-Hellman parameter for DHE ciphers (generate: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048)
        #ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # ─── Security Headers ───
        # HSTS: 2 years (63072000s), include subdomains, preload to browser HSTS lists
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Prevent clickjacking — only same-origin framing allowed
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Enable XSS filter in browsers
        add_header X-XSS-Protection "1; mode=block" always;
        # Control referrer information leakage
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Content Security Policy — strict but allows Next.js requirements
        #   - 'unsafe-inline' for scripts/styles: Next.js injects inline styles/scripts
        #   - 'unsafe-eval': required by some Next.js dev/tooling dependencies
        #   - data: and blob: for images: base64-encoded images, blobs from uploads
        #   - https: for images: external image sources (CDNs, etc.)
        #   - frame-ancestors 'self': superset of X-Frame-Options in CSP context
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        # Permissions Policy — restrict powerful browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ─── Block Common Attack Paths ───
        # WordPress scans, PHP admin tools, env files, config dumps, etc.
        location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php) {
            return 444;
        }
        location ~ ^/(phpmyadmin|pma|adminer|phpMyAdmin|PMA) {
            return 444;
        }
        location ~ ^/(\.env|\.git|\.svn|\.htaccess|\.htpasswd|\.DS_Store) {
            return 444;
        }
        location ~ ^/(config\.(js|json|yml|yaml|php)|database\.(yml|yaml|php)|credentials) {
            return 444;
        }
        location ~ ^/(actuator|console|debug|status|server-status|server-info) {
            return 444;
        }
        # Block dotfiles and hidden paths (except .well-known for ACME)
        location ~ /\.(?!well-known) {
            return 444;
        }

        # ─── Static Assets: Next.js Build Output (1 year, immutable) ───
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, immutable";
            expires 365d;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # ─── Static Assets: Icons (1 day) ───
        location /icons/ {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=86400";
            expires 1d;
        }

        # ─── Static Assets: Uploads (7 days) ───
        location /upload/ {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
        }

        location /uploads/ {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
        }

        # ─── PWA: Manifest (1 hour cache) ───
        location = /manifest.json {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/manifest+json";
        }

        # ─── PWA: Service Worker (no-cache, must revalidate) ───
        location = /sw.js {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Service-Worker-Allowed "/";
        }

        # ─── API: Admin Login (strict rate limit: 5r/m burst=3) ───
        location = /api/admin/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_dry_run off;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ─── API: Guest Authentication (rate limit: 10r/m burst=5) ───
        location = /api/guest/auth {
            limit_req zone=guest_auth burst=5 nodelay;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ─── API: All Other Routes (rate limit: 30r/m) ───
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ─── All Other Routes (Next.js SSR) ───
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ─── Deny access to backup/temp files ───
        location ~ ~$ {
            return 444;
        }
    }
}
