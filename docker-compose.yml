# ══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Josué & Hornella Wedding Platform
# Ultra-secure production deployment with Nginx reverse proxy & auto-updates
# ══════════════════════════════════════════════════════════════════════════════


services:
  # ─── Next.js Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - wedding-db:/app/db
      - wedding-uploads:/app/public/uploads
      - wedding-logs:/app/logs
    networks:
      - wedding-network
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3080:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wedding-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - wedding-nginx-logs:/var/log/nginx
    networks:
      - wedding-network
    depends_on:
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Watchtower — Automated Container Updates ─────────────────────────────
  # Only starts when the "auto-update" profile is activated:
  #   docker compose --profile auto-update up -d
  watchtower:
    image: containrrr/watchtower
    container_name: wedding-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: --interval 3600 --cleanup wedding-app wedding-nginx
    profiles:
      - auto-update
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true

# ══════════════════════════════════════════════════════════════════════════════
# Volumes — Persistent data storage
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  wedding-db:
    driver: local
  wedding-uploads:
    driver: local
  wedding-logs:
    driver: local
  wedding-nginx-logs:
    driver: local
  wedding-redis-data:
    driver: local

# ══════════════════════════════════════════════════════════════════════════════
# Networks — Isolated bridge network for inter-service communication
# ══════════════════════════════════════════════════════════════════════════════
networks:
  wedding-network:
    driver: bridge
