# ══════════════════════════════════════════════════════════════
# docker-compose.yml — Josué & Hornella Wedding Platform
# Production deployment with Nginx reverse proxy
# ══════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─── Next.js Application ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - wedding-db:/app/db
      - wedding-uploads:/app/public/uploads
    networks:
      - wedding-network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: wedding-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - wedding-nginx-logs:/var/log/nginx
    networks:
      - wedding-network
    depends_on:
      app:
        condition: service_healthy

volumes:
  wedding-db:
    driver: local
  wedding-uploads:
    driver: local
  wedding-nginx-logs:
    driver: local

networks:
  wedding-network:
    driver: bridge
